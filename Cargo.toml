[package]
name = "wedl-rs"
# Stay on v1 until docs/PLAN.md is complete.
version = "1.0.0"
edition = "2024"
license = "MIT"
description = "A breadth-first Rust implementation of WEDL's native story database"

[lib]
name = "wedl"
path = "src/lib.rs"

[[bin]]
name = "wedl-rs"
path = "src/main.rs"

[features]
snapshot-baseline = []

[dependencies]
axum = "0.8"
clap = { version = "4", features = ["derive"] }
hex = "0.4"
rusqlite = { version = "0.37", features = ["bundled", "serialize"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = { package = "serde_yaml_ng", version = "0.10" }
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
unicode-normalization = "0.1"
walkdir = "2"

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
