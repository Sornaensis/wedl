    type: object
    required:
      parents:
        type: array
        items:
          type: entity
          kinds:
          - lore-concept
        max_items: 8
      traits:
        type: string
      habitats:
        type: array
        items:
          type: string
        max_items: 8
    optional:
      taxonomy:
        type: string
      life_stage:
        type: 'null'
      culture:
        type: string
      language:
        type: string
      religion:
        type: 'null'
- id: species-individual
  label: Individual variation description
