<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WEDL · Author Workbench</title>
  <style>
    :root{color-scheme:dark;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#e1e8e5;background:#101715;--muted:#a6b6ae;--line:#2c3b34;--accent:#a9ddbc;--panel:#142019;--inset:#111c16;--warn:#f0cd92;--error:#ffb0a4}*{box-sizing:border-box}body{margin:0}a{color:var(--accent);text-underline-offset:.22em}h1,h2,h3,h4,p{margin-top:0}h1{font-size:1.7rem;margin-bottom:0}h2{font-size:clamp(1.75rem,4vw,2.45rem);letter-spacing:-.035em;margin-bottom:.65rem}h3{font-size:1.03rem;margin-bottom:.6rem}p{line-height:1.6;margin-bottom:.85rem;overflow-wrap:anywhere}button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer;background:#233b2e;border:1px solid #42634e;border-radius:6px;padding:.61rem .85rem;font-size:.9rem}button:hover{background:#2b4c39}button:disabled{opacity:.45;cursor:default}button.secondary{background:transparent;border-color:var(--line)}button.primary{background:#315641;border-color:#5d896d}a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible,[tabindex="-1"]:focus-visible{outline:2px solid var(--accent);outline-offset:3px}input,select,textarea{background:var(--inset);border:1px solid #42544a;border-radius:5px;padding:.6rem .68rem;width:100%;min-width:0}input[type=checkbox]{width:auto;accent-color:var(--accent)}label{display:block;font-size:.8rem;color:var(--muted);margin-bottom:.35rem}fieldset{padding:0;border:0;min-width:0}textarea{resize:vertical}details>summary{cursor:pointer;color:var(--accent)}
    .wrap{max-width:1240px;margin-inline:auto;padding-inline:clamp(1rem,4vw,2.25rem)}.row,.brand,.brand-group{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap}.brand{justify-content:space-between;padding-block:1.1rem}.brand-group{gap:.8rem}.mark{display:grid;place-items:center;width:2.5rem;height:2.5rem;border:1px solid #42634e;border-radius:8px;background:#17251d;color:var(--accent);flex:none}.mark svg{width:1.25rem;height:1.25rem}.spread{justify-content:space-between}.bar,.banner{border-bottom:1px solid var(--line)}.banner{background:#17251d;padding-block:.75rem}.banner p{margin:0}.eyebrow{font-size:.71rem;text-transform:uppercase;letter-spacing:.15em;color:var(--accent);font-weight:650;margin-bottom:.35rem}.tag{display:inline-flex;border:1px solid var(--line);background:#17251d;border-radius:99px;padding:.23rem .57rem;font-size:.73rem;color:#c4d6ca}.muted{color:var(--muted);font-size:.88rem}.warning{color:var(--warn)}.error{color:var(--error)}
    .shell{display:grid;grid-template-columns:224px minmax(0,1fr);min-height:70vh}.side{border-right:1px solid var(--line);padding:1.6rem 1.15rem 1rem 0}.side button{width:100%;text-align:left;background:transparent;border-color:transparent;margin-bottom:.25rem}.side button[aria-current=page]{background:#203c2b;border-color:#42634e;color:#d1edda}.side button:hover{background:var(--panel)}.content{min-width:0;padding:1.6rem 0 2rem 1.9rem}.layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(230px,30%);gap:.85rem}.stack{display:grid;gap:.85rem;align-content:start;min-width:0}.panel,.notice{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:1rem;min-width:0;overflow-wrap:anywhere}.panel p:last-child,.notice p:last-child{margin-bottom:0}.panel .row,.panel details{margin-top:.75rem}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.75rem;margin-bottom:.75rem}.check{display:flex;align-items:center;gap:.55rem;color:inherit;margin-top:.9rem}.checks{list-style:none;margin:.5rem 0 0;padding:0}.checks li{border-top:1px solid var(--line);padding:.6rem 0}.checks li span{color:var(--muted)}dl{margin:.5rem 0 0}dl div{display:grid;grid-template-columns:minmax(5rem,1fr) minmax(0,1.5fr);gap:.5rem;padding:.45rem 0;border-top:1px solid var(--line)}dt{color:var(--muted)}dd{margin:0;overflow-wrap:anywhere}ol{padding-left:1.25rem}.value{white-space:pre-wrap;overflow-wrap:anywhere}.diff{border-left:3px solid #42634e;background:var(--inset);padding:.65rem .75rem}.diff.before{border-color:#aa776c}.receipt{border-left:3px solid #6b9679}.receipt.warning{border-color:var(--warn)}.receipt.error{border-color:var(--error)}.report{min-height:1.2em;margin-top:.8rem}.skip{position:absolute;top:0;left:-1000px;background:var(--inset);padding:.65rem;z-index:4}.skip:focus{left:.7rem;top:.7rem}footer{border-top:1px solid var(--line);padding-block:1.2rem;font-size:.8rem;color:var(--muted)}[hidden]{display:none!important}
    @media(max-width:900px){.layout{grid-template-columns:1fr}}@media(max-width:660px){.shell{grid-template-columns:1fr}.side{border-right:0;border-bottom:1px solid var(--line);padding:.85rem 0;display:flex;gap:.25rem;flex-wrap:wrap}.side>p{width:100%}.side button{width:auto;padding:.48rem .6rem}.content{padding:1.2rem 0 1.5rem}}@media(max-width:470px){.grid{grid-template-columns:1fr}}
  </style>
  <script src="/workbench.js" defer></script>
  <script src="/workbench-core.js" defer></script>
  <script src="/workbench-archive.js" defer></script>
</head>
<body>
  <a href="#workspace" class="skip" id="skip">Skip to workspace</a>
  <header class="bar"><div class="wrap brand"><div class="brand-group"><span class="mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M12 3 4 7v10l8 4 8-4V7L12 3Zm0 5 4 2v4l-4 2-4-2v-4l4-2Z"/></svg></span><div><p class="eyebrow">WEDL / Private Author</p><h1>Author Workbench</h1></div></div><span class="tag">Private Author</span></div></header>
  <div class="banner"><div class="wrap row spread"><div><p class="eyebrow">Separate writing context</p><p><strong id="authority">Opening source…</strong> <span id="world" class="muted"></span></p></div><button class="secondary" type="button" id="refresh">Refresh source</button></div></div>
  <div class="wrap shell"><nav class="side" aria-label="Author workflows" id="workflows"><p class="eyebrow">Workflows</p></nav><main id="workspace" class="content" tabindex="-1"><p><a href="/compendium">← Back to Compendium</a></p><div id="panes"></div><p id="workbench-status" class="muted report" role="status"></p></main></div>
  <div class="wrap"><footer>Private Workbench changes use the native source, review, and publication checks.</footer></div>
</body>
</html>
