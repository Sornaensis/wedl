<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WEDL · Reader</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#e1e8e5;background:#101715;--muted:#a6b6ae;--line:#2c3b34;--accent:#a9ddbc}*{box-sizing:border-box}body{margin:0}header,main{max-width:960px;margin:auto;padding:1.5rem}header{border-bottom:1px solid var(--line)}h1{font-size:1.8rem;margin:.3rem 0}.eyebrow{text-transform:uppercase;letter-spacing:.12em;color:var(--accent);font-size:.75rem}.muted,label,.status{color:var(--muted)}label{display:block;font-size:.85rem;margin:.4rem 0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.8rem}input,button,select{font:inherit;color:inherit;border:1px solid #42544a;border-radius:6px;background:#111c16;padding:.65rem}input,select{width:100%}button{cursor:pointer;background:#233b2e}button:hover{background:#2b4c39}button:disabled{opacity:.45;cursor:default}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}.actions{display:flex;flex-wrap:wrap;gap:.6rem;margin:1rem 0}.status{font-size:.9rem;overflow-wrap:anywhere}.error{color:#ffb0a4}.item{border-top:1px solid var(--line);padding:1.2rem 0}.item h2{font-size:1.2rem;margin:.2rem 0 .7rem}.prose{font:inherit;white-space:pre-wrap;line-height:1.75;margin:0;overflow-wrap:anywhere}.kind{font-size:.75rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}[hidden]{display:none!important}@media(max-width:550px){.grid{grid-template-columns:1fr}header,main{padding:1rem}.actions button{flex:1}}
</style><script src="/reader.js" defer></script></head>
<body><header><p class="eyebrow">WEDL · Reader</p><h1>Read the revealed story.</h1><p class="muted">Choose the publication and reading position supplied by its author.</p></header>
<main><form id="reader-form"><div class="grid"><div><label for="publication">Publication</label><input id="publication" required maxlength="128" autocomplete="off" spellcheck="false"></div><div><label for="revision">Edition · full commit ID</label><input id="revision" required maxlength="64" autocomplete="off" spellcheck="false"></div><div><label for="occurrence">Reading position · starts at 0</label><input id="occurrence" type="number" min="0" max="1023" value="0" required></div><div><label for="page-size">Items per page</label><select id="page-size"><option value="20">20</option><option value="50">50</option><option value="100">100</option><option value="1">1</option></select></div></div><div class="actions"><button id="read" type="submit">Read this position</button></div></form>
<form id="search-form"><label for="query">Search revealed content</label><input id="query" maxlength="256" autocomplete="off" required><div class="actions"><button id="search" type="submit">Search</button></div></form>
<p id="reader-status" class="status" role="status"></p><section id="reader-results" hidden><p id="reader-count" class="muted"></p><div class="actions"><button id="previous" type="button" disabled>Previous position</button><button id="next" type="button" disabled>Next position</button></div><div id="reader-items"></div><div class="actions"><button id="more" type="button" disabled>Next page</button></div></section></main></body></html>
