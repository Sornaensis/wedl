protocol: wedl-spatial/v1
common:
  revision: 797688d9cab694e5c9099f48719630fe4fb659b4
  capabilities: [spatial-core-v1, geometry-v1, route-v1, overlay-v1]
  limit: {minimum: 1, maximum: 100}
  cursor: opaque-keyset-bound-to-normalized-request-and-revision
  states: [ok, invalid, unavailable, forbidden, limit]
  deterministic_orders:
    catalogue: [source_ordinal, stable_id]
    path: [requested_cost, source_ordinal, stable_id]
  diagnostics:
    malformed: SPATIAL-REQUEST-001
    missing_geometry: SPATIAL-GEOMETRY-001
    incompatible_metric: SPATIAL-METRIC-001
    no_authored_path: SPATIAL-PATH-001
    forbidden_overlay: SPATIAL-OVERLAY-001
    budget_exceeded: SPATIAL-LIMIT-001
    cursor_mismatch: SPATIAL-CURSOR-001
queries:
  containment:
    request: {protocol: wedl-spatial/v1, revision: 797688d9cab694e5c9099f48719630fe4fb659b4, capabilities: [spatial-core-v1, geometry-v1, route-v1, overlay-v1], limit: 10, cursor: null, location_id: location:archive}
    response: {state: ok, parent_path: [location:city, location:archive]}
  bbox:
    request: {protocol: wedl-spatial/v1, revision: 797688d9cab694e5c9099f48719630fe4fb659b4, capabilities: [spatial-core-v1, geometry-v1, route-v1, overlay-v1], limit: 10, cursor: null, map_id: map:riverward, bounds: {min: [0, 0], max: [100, 100]}}
    response: {state: ok, ids: [location:archive, location:shore-gate], order: [source_ordinal, stable_id]}
  nearby_incompatible:
    request: {protocol: wedl-spatial/v1, revision: 797688d9cab694e5c9099f48719630fe4fb659b4, capabilities: [spatial-core-v1, geometry-v1, route-v1, overlay-v1], limit: 10, cursor: null, from: {map_id: map:riverward, coordinates: [0, 0]}, to: {map_id: map:coast, coordinates: [12.0, 55.0]}}
    response: {state: unavailable, code: SPATIAL-METRIC-001}
  path_one_way_reverse:
    request: {protocol: wedl-spatial/v1, revision: 797688d9cab694e5c9099f48719630fe4fb659b4, capabilities: [spatial-core-v1, geometry-v1, route-v1, overlay-v1], limit: 10, cursor: null, from_location_id: location:shore-gate, to_location_id: location:archive, metric: route_distance}
    response: {state: unavailable, code: SPATIAL-PATH-001}
  overlay_as_of_public_hidden:
    request: {protocol: wedl-spatial/v1, revision: 797688d9cab694e5c9099f48719630fe4fb659b4, capabilities: [spatial-core-v1, geometry-v1, route-v1, overlay-v1], limit: 10, cursor: null, query_scope: location-catalogue, location_id: location:archive, at: {timeline: main, tick: "12", order: "0"}, audience: public, perspective: ordinary}
    response: {state: ok, overlays: [], story_time: {timeline: main, tick: "12", order: "0"}}
  overlay_as_of_no_overlay_control:
    request: {protocol: wedl-spatial/v1, revision: 797688d9cab694e5c9099f48719630fe4fb659b4, capabilities: [spatial-core-v1, geometry-v1, route-v1, overlay-v1], limit: 10, cursor: null, query_scope: location-catalogue, location_id: location:city, at: {timeline: main, tick: "12", order: "0"}, audience: public, perspective: ordinary}
    response: {state: ok, overlays: [], story_time: {timeline: main, tick: "12", order: "0"}}
  overlay_by_id_forbidden:
    request: {protocol: wedl-spatial/v1, revision: 797688d9cab694e5c9099f48719630fe4fb659b4, capabilities: [spatial-core-v1, geometry-v1, route-v1, overlay-v1], limit: 10, cursor: null, query_scope: explicit-overlay-id, overlay_id: overlay:ward, at: {timeline: main, tick: "12", order: "0"}, audience: public, perspective: ordinary}
    response: {state: forbidden, code: SPATIAL-OVERLAY-001}
  overlay_as_of_authorized:
    request: {protocol: wedl-spatial/v1, revision: 797688d9cab694e5c9099f48719630fe4fb659b4, capabilities: [spatial-core-v1, geometry-v1, route-v1, overlay-v1], limit: 10, cursor: null, query_scope: location-catalogue, location_id: location:archive, at: {timeline: main, tick: "12", order: "0"}, audience: council, perspective: council-archive}
    response: {state: ok, overlays: [overlay:ward], story_time: {timeline: main, tick: "12", order: "0"}}
  limit:
    request: {protocol: wedl-spatial/v1, revision: 797688d9cab694e5c9099f48719630fe4fb659b4, capabilities: [spatial-core-v1, geometry-v1, route-v1, overlay-v1], limit: 101, cursor: null, map_id: map:riverward, bounds: {min: [-1000000, -1000000], max: [1000000, 1000000]}}
    response: {state: limit, code: SPATIAL-LIMIT-001, records: []}
budgets:
  returned_records: 100
  route_expansions: 1000
  overlay_candidates_after_authorization: 2000
  geometry_vertices: 10000
