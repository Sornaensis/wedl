schema: wedl/v0.6
# The public machine-readable mirror of the complete diagnostic registry.
# `test_chronology_validation.py` parses this list and the Markdown table; it
# checks raw row counts and duplicates before comparing the exact registry.
# The negative corpus below also pins selected-year table/cycle leaf paths.
